<style>
:root {
  --red: #C8102E;
  --red-dark: #a8001c;
  --black: #0d0d0d;
  --navy: #012446;
  --dark2: #1a1a1a;
  --white: #ffffff;
  --gray: #888;
  --border-dark: rgba(255,255,255,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { overflow-x:hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--white);
  color: var(--navy);
  min-height: 100dvh;
  overflow-x: hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 32px 20px;
}

.wrap {
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  opacity: 0;
  animation: pageIn .6s ease forwards;
}

/* фирменные красные пятна-блоры, как на основном сайте */
body::before {
  content:'';
  position:fixed;
  top:-80px; left:-100px;
  width:380px; height:380px;
  background: radial-gradient(circle, rgba(200,16,46,0.06) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after {
  content:'';
  position:fixed;
  bottom:-60px; right:-100px;
  width:340px; height:340px;
  background: radial-gradient(circle, rgba(1,36,70,0.05) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

.logo {
  width: 100%;
  max-width: 320px;
  height: auto;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeUp .6s .1s forwards;
}

.tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp .6s .2s forwards;
}

.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 24px;
}

.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 58px;
  padding: 0 22px;
  border-radius: 50px;
  text-decoration: none;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  color: var(--white);
  transition: transform .15s ease, background .2s ease, border-color .2s ease;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp .5s ease forwards;
  -webkit-tap-highlight-color: transparent;
}
.link-btn:nth-child(1) { animation-delay: .3s; }
.link-btn:nth-child(2) { animation-delay: .38s; }
.link-btn:nth-child(3) { animation-delay: .46s; }
.link-btn:nth-child(4) { animation-delay: .54s; }

.link-btn:active { transform: scale(0.97); }

.link-btn.primary {
  background: var(--red);
}
@media (hover:hover) {
  .link-btn.primary:hover { background: var(--red-dark); }
}

.link-btn.outline {
  background: #f5f5f5;
  border: 1.5px solid var(--red);
  color: var(--navy);
}
@media (hover:hover) {
  .link-btn.outline:hover { background: #fbebee; }
}

.link-btn svg {
  width: 22px;
  height: 22px;
  flex: 0 0 22px;
  fill: currentColor;
}

.link-btn span {
  flex: 1;
  text-align: left;
}

@keyframes pageIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (min-width: 640px) {
  .link-btn { min-height: 60px; }
}
</style>
</head>
